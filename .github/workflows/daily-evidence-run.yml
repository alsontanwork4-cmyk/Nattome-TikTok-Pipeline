name: Daily Evidence Run Cloud Publisher

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *" # 01:00 UTC = 09:00 Asia/Singapore

permissions:
  contents: read

concurrency:
  group: daily-evidence-run-cloud-publisher
  cancel-in-progress: false

jobs:
  publish-daily-evidence-run:
    name: Publish Daily Evidence Run
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check required secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in APIFY_TOKEN GEMINI_API_KEY SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required GitHub secrets: %s\n' "${missing[*]}" >&2
            exit 2
          fi

          echo "Required GitHub secrets are configured."

      - name: Run daily TikTok discovery
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="nattome_$(date -u +'%Y%m%dT%H%M%SZ')"
          RUN_DIR="data/daily_runs/${RUN_ID}"
          RAW_SCRAPE_PATH="${RUN_DIR}/raw_scrape_top30.json"
          DAILY_SELECTION_PATH="${RUN_DIR}/daily_selection_top3.json"
          DAILY_BACKFILL_PATH="${RUN_DIR}/daily_backfill_candidates.json"

          mkdir -p "$RUN_DIR"
          {
            echo "RUN_ID=$RUN_ID"
            echo "RUN_DIR=$RUN_DIR"
            echo "RAW_SCRAPE_PATH=$RAW_SCRAPE_PATH"
            echo "DAILY_SELECTION_PATH=$DAILY_SELECTION_PATH"
            echo "DAILY_BACKFILL_PATH=$DAILY_BACKFILL_PATH"
          } >> "$GITHUB_ENV"

          python skills/nattome-tiktok-candidate-discovery/scripts/scrape_tiktok.py \
            --output "$RAW_SCRAPE_PATH" \
            --top 30 \
            --download-videos \
            --daily-selection-output "$DAILY_SELECTION_PATH"

      - name: Run evidence analysis and publish cloud records
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_batch_analysis.py \
            --candidates "$DAILY_SELECTION_PATH" \
            --backfill-candidates "$DAILY_BACKFILL_PATH" \
            --runs-dir runs/batch-analysis \
            --outputs-dir outputs \
            --publish-cloud | tee "$RUNNER_TEMP/daily_evidence_run.log"

      - name: Summarize final output paths and cloud publication status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          print("### Daily Evidence Run Cloud Publication")
          print("")
          print(f"- Discovery run id: `{os.environ.get('RUN_ID', 'not recorded')}`")

          run_root = Path("runs/batch-analysis")
          run_folders = sorted(
              [path for path in run_root.glob("*") if path.is_dir()],
              key=lambda path: path.stat().st_mtime,
          )
          if not run_folders:
              print("- Run Folder: not created")
              raise SystemExit(0)

          run_folder = run_folders[-1]
          print(f"- Run Folder: `{run_folder}`")

          manifest_path = run_folder / "run_manifest.json"
          if manifest_path.exists():
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              final_outputs = manifest.get("outputs", {}).get("final_outputs", [])
              print("- final_outputs:")
              if final_outputs:
                  for output in final_outputs:
                      label = output.get("label", "Output")
                      path = output.get("path", "")
                      kind = output.get("kind", "file")
                      print(f"  - {label} ({kind}): `{path}`")
              else:
                  print("  - none recorded")

          publication_path = run_folder / "logs" / "cloud_publication.json"
          if publication_path.exists():
              publication = json.loads(publication_path.read_text(encoding="utf-8"))
              print(f"- Cloud publication status: `{publication.get('status')}`")
              print(f"- Cloud artifact count: `{publication.get('artifact_count')}`")
              if publication.get("errors"):
                  print("- Cloud publication errors:")
                  for error in publication["errors"]:
                      print(f"  - `{error}`")
          else:
              print("- Cloud publication status: `not recorded`")
          PY
