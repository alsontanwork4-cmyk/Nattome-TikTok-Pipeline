name: Daily Source Video Run

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *" # 01:00 UTC = 09:00 Asia/Singapore

permissions:
  contents: read

concurrency:
  group: daily-source-video-run
  cancel-in-progress: false

jobs:
  daily-source-video-run:
    name: Daily Source Video Run
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check required secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${APIFY_TOKEN:-}" ]; then
            echo "Missing required GitHub secret: APIFY_TOKEN" >&2
            exit 2
          fi
          echo "Required GitHub secrets are configured."

      - name: Run daily TikTok discovery
        shell: bash
        run: |
          set -euo pipefail
          RUN_TIMESTAMP="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          RUN_STAMP="$(date -u -d "$RUN_TIMESTAMP" +'%Y%m%dT%H%M%SZ')"
          RUN_ID="nattome_${RUN_STAMP}"
          RUN_DIR="runs/batch-analysis/${RUN_STAMP}_daily"
          RAW_SCRAPE_PATH="${RUN_DIR}/data/raw_scrape_top30.json"
          DAILY_SELECTION_PATH="${RUN_DIR}/data/daily_selection_top_videos.json"

          mkdir -p "${RUN_DIR}/data"
          {
            echo "RUN_TIMESTAMP=$RUN_TIMESTAMP"
            echo "RUN_ID=$RUN_ID"
            echo "RUN_DIR=$RUN_DIR"
            echo "RAW_SCRAPE_PATH=$RAW_SCRAPE_PATH"
            echo "DAILY_SELECTION_PATH=$DAILY_SELECTION_PATH"
          } >> "$GITHUB_ENV"

          python batch_analysis/scrape_tiktok.py \
            --output "$RAW_SCRAPE_PATH" \
            --download-videos \
            --daily-selection-output "$DAILY_SELECTION_PATH"

      - name: Create source video run folder
        shell: bash
        run: |
          set -euo pipefail
          python batch_analysis/run_batch_analysis.py \
            --candidates "$DAILY_SELECTION_PATH" \
            --timestamp "$RUN_TIMESTAMP" \
            --runs-dir runs/batch-analysis | tee "$RUNNER_TEMP/daily_source_video_run.log"

      - name: Summarize run folder
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          print("### Daily Source Video Run")
          print("")
          print(f"- Discovery run id: `{os.environ.get('RUN_ID', 'not recorded')}`")

          run_root = Path("runs/batch-analysis")
          run_folders = sorted(
              [path for path in run_root.glob("*") if path.is_dir()],
              key=lambda path: path.stat().st_mtime,
          )
          if not run_folders:
              print("- Run Folder: not created")
              raise SystemExit(0)

          run_folder = run_folders[-1]
          print(f"- Run Folder: `{run_folder}`")
          index_path = run_folder / "data" / "evidence_bundle_index.json"
          if index_path.exists():
              index = json.loads(index_path.read_text(encoding="utf-8"))
              print(f"- Source snapshot count: `{index.get('bundle_count', 0)}`")
          PY
